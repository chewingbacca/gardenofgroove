name: Build VST3
on:
  push:
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: GrooveGarden-VST3-Windows
          path: build/GrooveGarden_artefacts/Release/VST3/
